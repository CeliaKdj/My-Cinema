<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Cinema - Séances</title>
    <link rel="shortcut icon" href="img/new-logo.png" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css?v=1.1">
  </head>

<!-- PAGE SÉANCES -->

  <body class="text-slate-100 min-h-screen flex">
    
    <!-- BARRE DE NAVIGATION LATÉRALE -->
    <nav class="w-1/4 md:w-60 text-black p-4 flex flex-col bg-nav">
      <div>
        <a href="index.html"><img src="img/new-logo.png" alt="" class="size-16 md:size-32 rounded object-cover"/></a>
      </div>
      <ul class="flex flex-col pt-6 text-sm md:text-2xl">
        <li class="pb-4 font-bold text-white uppercase"><a href="gestionfilm.html">Films</a></li>
        <li class="pb-4 font-bold text-white uppercase"><a href="gestionsalle.html">Salles</a></li>
        <li class="pb-4 font-bold text-white uppercase"><a class="page-active" href="gestionseance.html">Séances</a></li>
      </ul>
    </nav>

<!-- CONTENU PRINCIPAL -->
    <main class="w-3/4 flex flex-col items-center py-10 text-black">
      <div class="w-11/12 p-8 rounded-lg shadow-xl bloc">
        <div class="flex justify-between items-center mb-8 border-b pb-4">
            <h1 class="text-l md:text-2xl font-bold text-white uppercase">Programmations des Séances</h1>
            <button onclick="toggleScreeningForm()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium transition-colors text-base md:text-lg">
                    <span class="block md:hidden">+</span> <span class="hidden md:block">+ Planifier une séance</span>
            </button>
        </div>
      <!-- FORMULAIRE AJOUT SÉANCE -->
        <div id="add-screening-form" class="hidden mb-10 bg-slate-50 p-6 rounded-xl border-2 border-dashed border-slate-200">
            <h2 class="text-xl font-bold mb-4">Nouvelle Séance</h2>
            <form onsubmit="saveScreening(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <div class="flex flex-col">
                    <label class="text-sm font-bold text-slate-600 mb-1">Film</label>
                    <select id="movie_id" class="p-2 rounded border bg-white" required>
                        <option value="">-- Sélectionner un film --</option>
                    </select>
                </div>

                <div class="flex flex-col">
                    <label class="text-sm font-bold text-slate-600 mb-1">Salle</label>
                    <select id="room_id" class="p-2 rounded border bg-white" required>
                        <option value="">-- Sélectionner une salle --</option>
                    </select>
                </div>

                <div class="flex flex-col md:col-span-2">
                    <label class="text-sm font-bold text-slate-600 mb-1">Date et heure de début</label>
                    <input type="datetime-local" id="start_time" class="p-2 rounded border" required>
                </div>

                <div class="md:col-span-2 flex flex-col md:flex-row justify-end gap-3 mt-2">
    <input type="hidden" id="screening_id" value="">

    <button type="button" onclick="toggleScreeningForm()" class="text-slate-600">
        Annuler
    </button>

    <button id="screeningSubmitBtn" type="submit" class="bg-indigo-600 text-white px-6 py-2 rounded font-bold">
        Confirmer la séance
    </button>
</div>
            </form>
        </div>
        <!-- LISTE DES SEANCES -->
        <div id="screening-list" class="flex flex-col gap-4 w-full">
            <p class="text-slate-500 italic">Chargement du calendrier...</p>
        </div>
        
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
